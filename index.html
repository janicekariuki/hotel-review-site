<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hotel Review Site</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navigation">
        <div>
            <a href="#home">home</a>
        </div>
        <div>
            <a href="aboutus.html">about us</a>
        </div>
        <a href="background"></a>
    </nav>

    
    <h1>🛎️ Hotel Review Submission</h1>

    <form id="hotelForm">
        <label>
            Hotel Name:<br>
            <input type="text" id="hotelName" required>
        </label>
        <br><br>

        <label>
            Image URL:<br>
            <input type="text" id="hotelImage" required>
        </label>
        <br><br>

        <label>
            Star Rating (1–5):<br>
            <input type="number" id="hotelRating" min="1" max="5" required>
        </label>
        <br><br>

        <label>
            Review Comment:<br>
            <textarea id="hotelComment" rows="4" required></textarea>
        </label>
        <br><br>

        <button type="submit">Submit Review</button>
    </form>

    <div id="hotelList"></div>

    <script src="./script.js"></script>
    <script src="./index.js"></script>
</body>

</html>
